name: Version
description: >-
  Picks the version to stamp on the builds (the one given, else the v1.2.3 tag being built), checks
  every installer format accepts it, and exports it as VERSION for the rest of the job.

inputs:
  version:
    description: The version, e.g. 1.2.3. Leave empty to take it from the tag.
    required: false
    default: ''

outputs:
  version:
    description: The checked version.
    value: ${{ steps.check.outputs.version }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        version="$INPUT_VERSION"
        if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi

        # MSIs need MAJOR and MINOR up to 255 and PATCH up to 65535. 0.x versions are fine; 0.0.0 isn't.
        if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
          || (( BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255 || BASH_REMATCH[3] > 65535 )) \
          || [ "$version" = 0.0.0 ]; then
          echo "::error::Version '$version' isn't MAJOR.MINOR.PATCH above 0.0.0, with MAJOR and MINOR up to 255 and PATCH up to 65535."
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "VERSION=$version" >> "$GITHUB_ENV"
