name: Build for macOS

# DMGs for Apple Silicon and Intel, signed and notarized once the MACOS_* secrets are set (see
# RELEASING.md). release.yml calls this for every release; run it by hand to build only the Mac files.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build
        required: true
        default: 1.0.0

permissions:
  contents: read

jobs:
  dmg:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      SIGN: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}
      - uses: ./.github/actions/setup-gradle

      - name: Add the signing certificate to a temporary keychain
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          tasks=(:apps:desktop:packageDmg)
          props=("-PappVersion=$VERSION")
          if [ "$SIGN" = true ]; then
            # Download the dependencies first, so pty4j's helper can be signed before packaging.
            ./gradlew :platform:terminal:compileKotlinDesktop
            packaging/macos/sign-pty4j-helper.sh "$MACOS_SIGNING_IDENTITY" "$KEYCHAIN"
            tasks+=(:apps:desktop:notarizeDmg)
            props+=(
              -Pcompose.desktop.mac.sign=true
              "-Pcompose.desktop.mac.signing.identity=$MACOS_SIGNING_IDENTITY"
              "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN"
              "-Pcompose.desktop.mac.notarization.appleID=$APPLE_ID"
              "-Pcompose.desktop.mac.notarization.password=$APPLE_APP_PASSWORD"
              "-Pcompose.desktop.mac.notarization.teamID=$APPLE_TEAM_ID"
            )
          else
            echo "::warning::MACOS_CERTIFICATE isn't set, so this DMG is unsigned: macOS blocks it until the user clicks Open Anyway."
          fi
          ./gradlew "${tasks[@]}" "${props[@]}"
          mkdir -p dist
          cp "apps/desktop/build/compose/binaries/main/dmg/Lemonade Code-$VERSION.dmg" "dist/Lemonade-Code-$VERSION-macos-${{ matrix.arch }}.dmg"

      - name: Check the DMG passes Gatekeeper
        if: env.SIGN == 'true'
        run: |
          dmg="dist/Lemonade-Code-$VERSION-macos-${{ matrix.arch }}.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"

      - uses: ./.github/actions/upload-build
        with:
          name: macos-${{ matrix.arch }}

      - name: Remove the temporary keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
