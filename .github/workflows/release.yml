name: Release

# Builds Lemonade Code for macOS, Windows and Linux.
#
# A version tag (v1.2.3) drafts a GitHub release with every build attached and a download table per
# platform. Nothing reaches users until you publish that draft, which runs publish.yml.
#
# Running this workflow by hand is a dry run: it builds everything and keeps the files as workflow
# artifacts, listed in the run's summary, without touching releases or stores. Run it on main now
# and then: builds on main save Gradle's caches, which tag builds read.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run builds
        required: true
        default: 1.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: ${{ github.ref_type == 'tag' && 'Draft the GitHub release' || 'Summary' }}
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      DRAFT: ${{ github.ref_type == 'tag' && github.repository_owner == 'williankl' }}
      HOMEBREW: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      SNAP_STORE: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums and the notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          links=""
          if [ "$DRAFT" = true ]; then links="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"; fi
          .github/scripts/release-notes.sh "$VERSION" dist "$links" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Draft the release
        if: env.DRAFT == 'true'
        working-directory: dist
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            missing)
              # GitHub adds the generated notes (the changes since the last release) under ours.
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Lemonade Code $VERSION" \
                --notes-file "$RUNNER_TEMP/notes.md" --generate-notes -- *
              ;;
            true)
              # A re-run: replace the files, keep the notes in case they were edited.
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
              ;;
            *)
              echo "::error::Release $TAG is already published; its files were left alone."
              exit 1
              ;;
          esac
          echo "Draft: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
